name: CI

on:
  push:
    branches: [main, 'chore/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Unit tests
        run: npm run test:mock
      - name: Vitest tests
        run: npx vitest run
      - name: Build CLI
        run: npm run build && npm start -- --help
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser regression tests (offline providers)
        run: npm run test:e2e-ui
